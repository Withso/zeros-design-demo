<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pill</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
zd-pill { display: inline-block; vertical-align: middle; }
/* Unscoped on purpose, to check the fix for issue 10: Zeros limits a
   component's style to its own instances, so this rule recolours only the
   Pill's badge, not the other .badge elements in a frame that places it. */
.badge { --badge-ink: var(--accent); --badge-wash: var(--accent-soft); }
</style>
</head>
<body>
<span class="badge badge--soft" data-zid="pill"><span class="badge-dot" data-zid="pill-dot"></span><slot>New</slot></span>
</body>
</html>

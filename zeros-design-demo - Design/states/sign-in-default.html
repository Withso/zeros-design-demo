<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Default</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<style>
.auth { display: grid; place-items: center; min-height: 100vh; padding: var(--space-5); }
.auth-card { display: flex; flex-direction: column; gap: var(--space-4); width: 100%; max-width: 360px; padding: var(--space-6) var(--space-5); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); box-shadow: var(--shadow-md); }
.auth-brand { display: flex; align-items: center; gap: var(--space-2); color: var(--fg-strong); font-weight: var(--weight-bold); }
.auth-mark { width: 24px; height: 24px; flex: none; border-radius: var(--radius-full); background: conic-gradient(from 180deg, var(--accent), var(--success), var(--accent)); }
.auth-actions { display: flex; justify-content: flex-end; }
.auth-foot { color: var(--fg-muted); font-size: var(--text-caption); line-height: var(--text-caption--line-height); text-align: center; }
</style>
</head>
<body>
<main class="auth" data-name="Sign in">
<section class="auth-card" data-oid="signin-card" data-name="Sign in card">
<div class="auth-brand" data-name="Brand"><span class="auth-mark" data-name="Mark"></span>Orbit</div>
<h1 class="sheet-title" data-name="Title">Sign in</h1>
<zd-text-field data-oid="signin-email" label="Email" value="arun@orbit.dev" placeholder="you@example.com" hint="" width="40"></zd-text-field>
<zd-text-field data-oid="signin-password" label="Password" value="••••••••••" hint="" width="40"></zd-text-field>
<div class="auth-actions" data-name="Actions"><zd-button data-oid="signin-submit" label="Sign in" icon="false"></zd-button></div>
<p class="auth-foot" data-name="Footer">No account yet? Ask your workspace owner.</p>
</section>
</main>
</body>
</html>
